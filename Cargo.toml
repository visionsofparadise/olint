[package]
name = "olint"
version = "0.1.0"
authors = ["Matt Cavender"]
description = "Asymptotic cost lint for TypeScript"
license = "MIT"
repository = "https://github.com/visionsofparadise/olint"
publish = false
edition = "2021"
rust-version = "1.96"

[lints.rust]
nonstandard_style = "deny"

[dependencies]
oxc_allocator = "=0.149.0"
oxc_parser = "=0.149.0"
oxc_ast = "=0.149.0"
oxc_ast_visit = "=0.149.0"
oxc_span = "=0.149.0"
oxc_semantic = "=0.149.0"
oxc_syntax = "=0.149.0"
oxc_resolver = "=11.24.3"
globset = "=0.4.20"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
clap = { version = "=4.6.6", features = ["derive"] }
indexmap = "=2.14.2"

[dev-dependencies]
tempfile = "=3.27.0"

[package.metadata.cargo-machete]
ignored = []
